name: SmartPads Site Health

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:          # allows manual runs from GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write   # needed to create GitHub issues

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run health checks
        id: playwright
        run: npx playwright test
        continue-on-error: true  # lets the diagnose step run even on failure

      - name: Generate AI diagnosis and open issue
        if: steps.playwright.outcome == 'failure'
        run: node diagnose.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PLAYWRIGHT_RESULTS: results.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}

      - name: Fail the workflow if checks failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
