name: Keepalive

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          committer_username: github-actions[bot]
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: keepalive to prevent scheduled workflow disable"
          time_elapsed: 50
